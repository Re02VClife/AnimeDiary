<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23fb7299'/%3E%3Cstop offset='1' stop-color='%23b985ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-family='Segoe UI,Arial' font-size='36' font-weight='700' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E"
    />
    <title>AnimeDiary - 番剧评分管理</title>
    <style>
      /* JS 与 CSS 加载前的底色，避免打开瞬间白屏闪烁 */
      html { background: #0d1117; }
    </style>
    <script>
      /*
       * 首帧之前定主题。
       * 以前这里写死深色底：浅色主题的用户每次启动都会先闪一下黑，再变白。
       * 这段在 CSS/React 之前执行，直接把底色和 data-theme 定好，首帧就是对的。
       * 键名与 src/theme/types.ts 的 THEME_STORAGE_KEY 保持一致。
       */
      (function () {
        try {
          var raw = localStorage.getItem('anime_diary_theme');
          var saved = raw ? JSON.parse(raw) : null;
          var light = !!saved && saved.themeMode === 'light';
          document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
          document.documentElement.style.background = light ? '#ffffff' : '#0d1117';
        } catch (e) {
          /* 读不到（首次启动/被禁用 localStorage）就用深色默认 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
